name: Build and Release AI-Local

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          # setup-android installs the command-line tools, but sdkmanager
          # is not necessarily added to PATH on the runner.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version
          "$ANDROID_HOME/platform-tools/adb" version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir -p release/AI-Local
          cp app/build/outputs/apk/debug/app-debug.apk release/AI-Local/AI-Local.apk
          printf '%s\n' "AI Local build generated by GitHub Actions." > release/AI-Local/README.txt
          (cd release && zip -r AI-Local.zip AI-Local)

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Local-build
          path: |
            release/AI-Local/AI-Local.apk
            release/AI-Local.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-local-${{ github.run_number }}
          name: AI Local ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/AI-Local/AI-Local.apk
            release/AI-Local/AI-Local.zip

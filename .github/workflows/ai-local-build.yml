name: Build and Release AI-Local

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Package
        run: |
          mkdir -p release/AI-Local
          cp app/build/outputs/apk/debug/app-debug.apk release/AI-Local/AI-Local.apk
          printf '%s\n' "AI Local build generated by GitHub Actions." > release/AI-Local/README.txt
          (cd release && zip -r AI-Local.zip AI-Local)
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Local
          path: |
            release/AI-Local/AI-Local.apk
            release/AI-Local.zip
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-local-${{ github.run_number }}
          name: AI Local ${{ github.run_number }}
          files: |
            release/AI-Local/AI-Local.apk
            release/AI-Local/AI-Local.zip

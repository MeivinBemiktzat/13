name: Build and Release AI-Local

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory does not exist: $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -executable -print -quit 2>/dev/null || true)"
          ADB="$ANDROID_HOME/platform-tools/adb"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Contents of Android SDK:"
            find "$ANDROID_HOME" -maxdepth 4 -type f 2>/dev/null | sort | head -200 || true
            exit 1
          fi

          if [ ! -x "$ADB" ]; then
            echo "ERROR: adb was not found at $ADB"
            find "$ANDROID_HOME/platform-tools" -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "Using adb: $ADB"

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "$SDKMANAGER_DIR"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version
          "$ADB" version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -executable -print -quit 2>/dev/null)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -executable -print -quit 2>/dev/null)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager disappeared before package installation."
            exit 1
          fi

          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release/AI-Local
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/AI-Local/AI-Local.apk
          printf '%s\n' "AI Local build generated by GitHub Actions." > release/AI-Local/README.txt
          (cd release && zip -r AI-Local.zip AI-Local)

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Local-build
          path: |
            release/AI-Local/AI-Local.apk
            release/AI-Local/AI-Local.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-local-${{ github.run_number }}
          name: AI Local ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/AI-Local/AI-Local.apk
            release/AI-Local/AI-Local.zip

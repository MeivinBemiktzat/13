name: Build and Release AI-Local

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/emulator:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
          command -v adb
          adb version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir -p release/AI-Local
          cp app/build/outputs/apk/debug/app-debug.apk release/AI-Local/AI-Local.apk
          printf '%s\n' "AI Local build generated by GitHub Actions." > release/AI-Local/README.txt
          (cd release && zip -r AI-Local.zip AI-Local)

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Local-build
          path: |
            release/AI-Local/AI-Local.apk
            release/AI-Local.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ai-local-${{ github.run_number }}
          name: AI Local ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/AI-Local/AI-Local.apk
            release/AI-Local/AI-Local.zip
